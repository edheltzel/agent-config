# Installed by the do-gh-pm feedback-agent overlay (interview Q7).
# Before committing to a target repo, replace ORG/PROJECT_NUMBER with the
# central board (e.g. Gentle-Art-Technologies/3). The `projects:` key is
# best-effort auto-add; feedback-router.yml is the reliable board path.
name: Feedback
description: An idea, request, question, or anything else on your mind
title: "[Feedback]: "
labels: ["needs:triage"]
projects: ["ORG/PROJECT_NUMBER"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: What kind of feedback is this?
      options:
        - Idea / feature request
        - Improvement to something existing
        - Question
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What's on your mind?
      description: The more specific, the faster it can be acted on.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where did this come up? Links, screenshots — anything helpful.
    validations:
      required: false
